<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AION 2 Vault</title>
<meta name="vault-token" content="__VAULT_TOKEN__">
<meta name="referrer" content="no-referrer">
<style>
  :root {
    --bg: #1b1b1b; --panel: #222; --row: #242424; --row-alt: #202020; --row-hover: #2c2c2c;
    --line: #333; --text: #e6e6e6; --muted: #8d8d8d; --dim: #6a6a6a;
    --accent: #5b8a4c; --accent-hi: #74ad61; --up: #6fbf6a; --down: #e25b55;
    --gold: #e0b44c; --cool: #4aa3ff; --warn: #f0a020;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .app { display: grid; grid-template-columns: 230px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 0; overflow-y: auto; }
  aside h2 { font-size: 18px; font-weight: 600; margin: 0 0 16px 22px; }
  .cat { display: flex; align-items: center; gap: 10px; margin: 2px 10px; padding: 7px 12px;
    border-radius: 6px; cursor: pointer; color: #a9c99d; user-select: none; }
  .cat:hover { background: #2b2b2b; }
  .cat.active { background: var(--accent); color: #fff; }
  .cat .ic { width: 22px; text-align: center; font-size: 15px; }
  .cat .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat .v { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cat.active .v { color: #e6f1e2; }
  main { overflow: hidden; display: flex; flex-direction: column; padding: 18px 18px 0; min-width: 0; }
  header { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; margin-bottom: 14px; }
  header h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; width: 100%; display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .search { position: relative; }
  .search input { width: 220px; padding: 8px 10px 8px 32px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); }
  input, select, button { background: #1d1d1d; color: var(--text); border: 1px solid #3a3a3a;
    border-radius: 6px; font: inherit; }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  select { padding: 8px 10px; min-width: 200px; background: #2a2a2a; }
  .fee input { width: 70px; padding: 8px 10px; }
  select.attn { border-color: var(--gold); animation: attn 1.6s ease-in-out infinite; }
  @keyframes attn { 50% { box-shadow: 0 0 0 3px #e0b44c55; } }
  .pills { display: inline-flex; background: #161616; border: 1px solid #2c2c2c; border-radius: 20px; padding: 3px; }
  .pills button { border: 0; background: transparent; padding: 6px 14px; border-radius: 16px; cursor: pointer; color: #cfcfcf; }
  .pills button.on { background: #2b2b2b; color: #fff; font-weight: 600; box-shadow: inset 0 0 0 1px #3a3a3a; }
  .btn { padding: 8px 12px; cursor: pointer; background: #2a2a2a; }
  .btn:hover { background: #333; }
  #refresh { min-width: 118px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: color .2s, border-color .2s; }
  #refresh .ic { display: inline-block; width: 14px; text-align: center; }
  #refresh:disabled { cursor: default; color: #a8a8a8; }
  #refresh.spin { color: var(--text); border-color: var(--accent); }
  #refresh.spin .ic { animation: spin .9s linear infinite; }
  #refresh.cool { background: linear-gradient(90deg, #33412f var(--p, 0%), #242424 var(--p, 0%)); }
  #refresh.ok { color: var(--up); border-color: #4e7a45; }
  #refresh.bad { color: var(--down); border-color: #7a3c39; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes flash { 0% { border-color: var(--accent-hi); box-shadow: 0 0 0 1px var(--accent-hi) inset; } 100% { border-color: var(--line); box-shadow: none; } }
  .cards.flash .card { animation: flash 1.2s ease-out; }
  .status { font-size: 12px; font-weight: 400; padding: 4px 10px; border-radius: 12px; background: #262626;
    border: 1px solid #333; display: inline-flex; align-items: center; gap: 7px; color: #cfcfcf; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .status.live i { background: var(--up); box-shadow: 0 0 6px var(--up); }
  .status.wait i { background: var(--warn); }
  .status.error i { background: var(--down); }
  .status.demo i { background: var(--cool); }
  .status.npcap_missing i, .status.needs_admin i { background: var(--warn); }
  .activity { font-size: 12px; font-weight: 400; color: var(--muted); display: inline-flex; align-items: center; gap: 7px;
    opacity: 0; transition: opacity .4s; pointer-events: none; }
  .activity.on { opacity: 1; }
  .spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #3a3a3a; border-top-color: var(--accent-hi);
    animation: spin .8s linear infinite; flex: none; }
  @keyframes shimmer { 0% { background-position: -40px 0; } 100% { background-position: 40px 0; } }
  .name .ph.shim, .name img:not(.ok) {
    background: linear-gradient(90deg, #1a1a1a 0%, #2c2c2c 50%, #1a1a1a 100%) #1a1a1a; background-size: 80px 100%;
    animation: shimmer 1.1s linear infinite; }
  .cards { display: grid; grid-template-columns: 1.3fr repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .card .k { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .card .k { font-size: 12px; color: var(--muted); }
  .card .val { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 7px; }
  .card.total .val { color: var(--gold); }
  .note { font-size: 12px; color: var(--muted); margin: -6px 0 10px; }
  .banner { display: flex; gap: 16px; align-items: center; background: #2a2418; border: 1px solid #5c4a22;
    border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
  .banner .bi { font-size: 22px; }
  .banner h3 { margin: 0 0 4px; font-size: 15px; }
  .banner p, .banner ol { margin: 0; color: #cfc4a8; font-size: 13px; }
  .banner ol { padding-left: 18px; }
  .banner .acts { display: flex; gap: 8px; margin-left: auto; flex: none; }
  .banner a.btn, .banner button { text-decoration: none; color: var(--text); padding: 8px 12px; border-radius: 6px;
    border: 1px solid #3a3a3a; background: #2a2a2a; cursor: pointer; font: inherit; }
  .banner .primary { background: var(--accent); border-color: var(--accent-hi); color: #fff; }
  .banner.update { background: #1f2a1c; border-color: #3d5a33; }
  .banner.update p { color: #b9c9b0; }
  .note.err { color: var(--down); }
  .tablewrap { flex: 1; overflow: auto; border: 1px solid var(--line); border-radius: 6px 6px 0 0; }
  table { width: 100%; border-collapse: collapse; }
  thead th { position: sticky; top: 0; background: #2a2a2a; text-align: left; font-weight: 600; font-size: 13px;
    padding: 8px 12px; border-bottom: 1px solid #3a3a3a; cursor: pointer; white-space: nowrap; user-select: none; z-index: 1; }
  thead th.sorted { color: var(--accent-hi); }
  thead th .arr { opacity: .45; font-size: 10px; margin-left: 4px; }
  thead th.sorted .arr { opacity: 1; }
  td { padding: 7px 12px; border-bottom: 1px solid #2c2c2c; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody tr:nth-child(odd) { background: var(--row); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); box-shadow: inset 0 1px 0 #4e6e44, inset 0 -1px 0 #4e6e44; }
  .num { text-align: right; }
  th.num { text-align: right; }
  .name { display: flex; align-items: center; gap: 10px; min-width: 260px; }
  .name img, .name .ph { width: 30px; height: 30px; border-radius: 5px; background: #151515; border: 1px solid #333; flex: none; object-fit: cover; }
  .name b { font-weight: 600; }
  .name small { display: block; color: var(--dim); font-size: 11px; }
  .loc { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #2d2d2d; color: #bdbdbd; }
  .loc.l-inv { background: #2f2c24; color: #d8c79a; }
  .loc.l-char { background: #2a2f3a; color: #9fb7e0; }
  .loc.l-srv { background: #2c2a38; color: #b9a7e8; }
  .loc.l-other { background: transparent; color: var(--dim); border: 1px dashed #3a3a3a; }
  .locs { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .loc .lq { opacity: .7; font-variant-numeric: tabular-nums; margin-left: 2px; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .kinah { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-left: 5px;
    background: radial-gradient(circle at 35% 35%, #ffe9a0, #c9952c 60%, #7a5514); }
  .total-cell { font-weight: 600; color: #f1d58a; }
  .liq { font-weight: 600; } .liq.hot { color: var(--warn); } .liq.mid { color: var(--gold); } .liq.cool { color: var(--cool); } .liq.none { color: var(--dim); font-weight: 400; }
  .muted { color: var(--dim); }
  .mark { color: var(--muted); margin-right: 6px; font-size: 12px; cursor: help; }
  .mark.warn { color: var(--warn); }
  #tip table { width: 100%; margin: 10px 0 4px; font-size: 12px; text-align: left; }
  #tip td { padding: 2px 4px; border: 0; background: none; }
  #tip tr.use td { color: var(--gold); font-weight: 600; }
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
  .empty h3 { color: var(--text); margin: 0 0 8px; font-weight: 600; }
  .empty ol { display: inline-block; text-align: left; margin: 10px 0 0; }
  .g-Common { color: #e6e6e6; } .g-Superior, .g-Rare { color: #7fd36d; } .g-Heroic, .g-Epic { color: #5fb0ff; }
  .g-Fabled, .g-Legendary, .g-Legend, .g-Unique { color: #f0c75a; } .g-Eternal { color: #ff9447; } .g-Mythic { color: #c98cff; }
  #tip { position: fixed; pointer-events: none; z-index: 10; width: 380px; background: #1f1f1f; border: 1px solid #444;
    border-radius: 8px; padding: 14px 16px; box-shadow: 0 10px 30px #000a; display: none; text-align: center; }
  #tip h4 { margin: 0 0 8px; font-size: 16px; padding-bottom: 8px; border-bottom: 1px solid #3a3a3a; }
  #tip p { margin: 6px 0 10px; color: #9b8ff0; white-space: pre-line; font-size: 13px; }
  #tip img { width: 64px; height: 64px; }
  #tip .meta { font-size: 12px; color: var(--muted); }
  footer { font-size: 11px; color: var(--dim); padding: 6px 2px 8px; display: flex; gap: 16px; align-items: center; }
  footer label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; margin-left: auto; white-space: nowrap; }
  footer label input { margin: 0; width: 12px; height: 12px; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #cfcfcf; cursor: pointer; padding-bottom: 8px; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { display: flex; overflow-x: auto; padding: 8px; } aside h2 { display: none; }
    .cards { grid-template-columns: repeat(2, 1fr); }
    main { overflow: visible; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h2>Categories</h2>
    <div id="cats"></div>
  </aside>
  <main>
    <header>
      <h1>Storage Value <span id="status" class="status"><i></i><span>Starting…</span></span>
        <span id="activity" class="activity" aria-live="polite"><i class="spinner"></i><span></span></span></h1>
      <div class="field search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8d8d8d" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" placeholder="Filter items…" autocomplete="off">
      </div>
      <div class="field"><label>Location</label><div class="pills" id="locs"></div></div>
      <div class="field"><label>Price basis</label><div class="pills" id="modes">
        <button data-v="fair" title="Lowest of: current listing, 7-day median, 24h sold average; capped at the region median when it looks like an outlier">Fair price</button><button data-v="lowest">Lowest listing</button><button data-v="sold_avg">Avg sold 24h</button></div></div>
      <label class="chk"><input type="checkbox" id="unpriced"> Show unpriced</label>
      <div class="grow"></div>
      <div class="field fee"><label>Market fee %</label><input id="fee" type="number" min="0" max="100" step="0.5"></div>
      <div class="field"><label>Server</label><select id="server"></select></div>
      <div class="field"><label>&nbsp;</label><button class="btn" id="refresh" title="Refetch prices"><span class="ic">↻</span><span class="lbl">Prices</span></button></div>
    </header>
    <div class="cards">
      <div class="card total"><div class="k">Total sell value · <span id="c-count">–</span> priced</div><div class="val" id="c-total">–</div></div>
      <div class="card"><div class="k">Inventory</div><div class="val" id="c-inv">–</div></div>
      <div class="card"><div class="k">Character storage</div><div class="val" id="c-char">–</div></div>
      <div class="card"><div class="k">Server storage</div><div class="val" id="c-srv">–</div></div>
      <div class="card"><div class="k" id="c-kinah-k">Tradable Kinah</div><div class="val" id="c-kinah">–</div></div>
    </div>
    <div class="banner" id="banner" style="display:none"></div>
    <div class="note" id="note"></div>
    <div class="tablewrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none"></div>
    </div>
    <footer><span id="f-prices"></span><span id="f-stats"></span><span>Prices: aion2.exchange (asking prices) · Names &amp; icons: NCSOFT</span>
      <label title="About twice a day, asks GitHub whether a newer release is out. Nothing about you or your items is sent"><input type="checkbox" id="upd"> <span id="f-ver"></span> · check for updates</label></footer>
  </main>
</div>
<div id="tip"></div>
<script>
const $ = id => document.getElementById(id);
const COLS = [
  { k: "name", t: "Name" },
  { k: "location", t: "Location" },
  { k: "count", t: "Qty", num: 1 },
  { k: "unit", t: "Unit value", num: 1 },
  { k: "total", t: "Total value", num: 1 },
  { k: "change", t: "24h Change", num: 1 },
  { k: "spark", t: "7d Trend", nosort: 1 },
  { k: "listings", t: "Listings", num: 1 },
  { k: "sold", t: "Liquidity", num: 1 },
];
const ICONS = { "All items": "◆", "Weapons": "⚔", "Armor": "🛡", "Accessories": "💍", "Consumables & collectibles": "🧪",
  "Consumables": "🧪", "Skins": "👘", "Materials": "⛏", "Other": "📦", "Not on market": "∅", "Untradeable": "🔒" };

const LOC_CLASS = { "Inventory": "l-inv", "Character storage": "l-char", "Server storage": "l-srv" };
const LOC_ORDER_TAIL = ["Equipped", "Soul Sync recovery", "Other"];
const BASIS_MARK = {
  region_cap: '<span class="mark warn" title="Price on this server looked like an outlier, so the region median is used">⚠</span>',
  region: '<span class="mark" title="Not listed on this server, so the region median is used">≈</span>',
  week: '<span class="mark" title="Current listing is above the 7-day median, so the 7-day median is used">~</span>',
  sold: '<span class="mark" title="Recent sales were cheaper than the current listing, so the 24h sold average is used">~</span>',
};
const BASIS_TEXT = { listing: "lowest listing now", week: "7-day median listing", sold: "24h sold average",
  region: "region median (not listed here)", region_cap: "region median (local price looked like an outlier)" };
const LOC_ORDER = ["All", "Inventory", "Character storage", "Server storage", ...LOC_ORDER_TAIL];
let S = null, view = { cat: "All items", loc: "All", sort: "total", dir: -1, q: "", unpriced: false };
try { Object.assign(view, JSON.parse(localStorage.getItem("vault-view") || "{}")); } catch (e) {}
const saveView = () => { try { localStorage.setItem("vault-view", JSON.stringify(view)); } catch (e) {} };

function fmt(n) {
  if (n == null || isNaN(n)) return "–";
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(a >= 1e10 ? 1 : 2) + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 1 : 2) + "M";
  if (a >= 1e4) return (n / 1e3).toFixed(1) + "K";
  return Math.round(n).toLocaleString();
}
const kin = v => v == null ? `<span class="muted">${S && S.loading ? "…" : "–"}</span>` : fmt(v) + '<span class="kinah"></span>';
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ago(ts) {
  if (!ts) return "never";
  const s = Date.now() / 1000 - ts;
  if (s < 90) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  return Math.round(s / 3600) + " h ago";
}
function spark(pts) {
  if (!pts || pts.length < 2) return '<span class="muted">–</span>';
  const w = 118, h = 26, lo = Math.min(...pts), hi = Math.max(...pts), r = hi - lo || 1;
  const xy = pts.map((p, i) => [(i / (pts.length - 1)) * w, h - 3 - ((p - lo) / r) * (h - 6)]);
  const line = xy.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join(" ");
  const up = pts[pts.length - 1] >= pts[0], c = up ? "#5aa155" : "#d0504a";
  const id = "g" + Math.random().toString(36).slice(2, 8);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${c}" stop-opacity=".55"/><stop offset="1" stop-color="${c}" stop-opacity=".05"/></linearGradient></defs>
    <path d="${line} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`;
}
function liquidity(r) {
  if (r.unit == null) return '<span class="liq none">No market</span>';
  const s = r.sold || 0;
  if (s >= 100) return '<span class="liq hot">🔥 Hot</span>';
  if (s >= 10) return '<span class="liq mid">〰 Steady</span>';
  return '<span class="liq cool">❄ Slow</span>';
}

function visible() {
  const q = view.q.trim().toLowerCase();
  const rows = S.items.filter(r =>
    (view.cat === "All items" || r.section === view.cat) &&
    (view.loc === "All" || r.location === view.loc) &&
    (view.unpriced || r.total != null || r.basis === "stale" || S.loading) &&
    (!q || r.name.toLowerCase().includes(q) || String(r.key).includes(q) || (r.category || "").toLowerCase().includes(q)));
  return view.loc === "All" ? mergeLocations(rows) : rows;
}
// On "All", one row per item: quantities and values added up, with every place it's kept.
// Only counted locations are merged; equipped or unidentified copies keep their own row.
function mergeLocations(rows) {
  const rank = l => { const i = LOC_ORDER.indexOf(l); return i < 0 ? 99 : i; };
  const out = [], byKey = new Map();
  for (const r of rows) {
    const m = r.counted && byKey.get(r.key);
    if (!m) {
      const row = { ...r, parts: [{ location: r.location, count: r.count }] };
      out.push(row);
      if (r.counted) byKey.set(r.key, row);
      continue;
    }
    m.count += r.count;
    if (r.total != null) m.total = (m.total || 0) + r.total;
    m.parts.push({ location: r.location, count: r.count });
    m.parts.sort((a, b) => rank(a.location) - rank(b.location));
    m.location = m.parts.map(p => p.location).join(", ");   // for sorting by location
  }
  return out;
}
function locCell(r) {
  if (!r.counted)
    return `<span class="loc l-other" title="${r.location === "Other" ? `Unidentified storage (container ${r.container})`
      : esc(r.location)}. Not counted in the total.">${esc(r.location)}</span>`;
  const parts = r.parts || [{ location: r.location, count: r.count }];
  const tip = parts.length > 1 ? ` title="${esc(parts.map(p => `${p.location}: ${p.count.toLocaleString()}`).join("\n"))}"` : "";
  return `<span class="locs"${tip}>${parts.map(p =>
    `<span class="loc ${LOC_CLASS[p.location] || ""}">${esc(p.location)}${parts.length > 1
      ? ` <span class="lq">${p.count.toLocaleString()}</span>` : ""}</span>`).join("")}</span>`;
}
function sorted(rows) {
  const k = view.sort, d = view.dir;
  return rows.slice().sort((a, b) => {
    let x = a[k], y = b[k];
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    if (typeof x === "string") return x.localeCompare(y) * d;
    return (x - y) * d;
  });
}

function renderHead() {
  $("head").innerHTML = COLS.map(c => {
    const on = view.sort === c.k;
    const arr = c.nosort ? "" : `<span class="arr">${on ? (view.dir > 0 ? "▲" : "▼") : "⇅"}</span>`;
    return `<th data-k="${c.k}" class="${c.num ? "num " : ""}${on ? "sorted" : ""}">${c.t}${arr}</th>`;
  }).join("");
}
function renderCats() {
  const base = S.items.filter(r => (view.loc === "All" || r.location === view.loc) &&
    (view.unpriced || r.total != null || r.basis === "stale" || S.loading));
  const agg = {};
  for (const r of base) { const a = agg[r.section] ||= { n: 0, v: 0 }; a.n++; a.v += r.total || 0; }
  const order = ["Weapons", "Armor", "Accessories", "Consumables & collectibles", "Skins", "Materials", "Other", "Not on market", "Untradeable"];
  const names = ["All items", ...order.filter(n => agg[n]), ...Object.keys(agg).filter(n => !order.includes(n))];
  const tot = base.filter(r => r.counted).reduce((s, r) => s + (r.total || 0), 0);
  $("cats").innerHTML = names.map(n => {
    const v = n === "All items" ? tot : agg[n].v;
    return `<div class="cat ${view.cat === n ? "active" : ""}" data-c="${esc(n)}"><span class="ic">${ICONS[n] || "•"}</span>
      <span class="n">${esc(n)}</span><span class="v">${v ? fmt(v) : ""}</span></div>`;
  }).join("");
}
function renderPills() {
  const rank = l => { const i = LOC_ORDER.indexOf(l); return i < 0 ? 99 : i; };
  const locs = ["All", ...new Set(S.items.map(r => r.location))].sort((a, b) =>
    rank(a) - rank(b) || a.localeCompare(b));
  if (!locs.includes(view.loc)) view.loc = "All";
  $("locs").innerHTML = locs.map(l => `<button data-v="${esc(l)}" class="${view.loc === l ? "on" : ""}">${esc(l)}</button>`).join("");
  for (const b of $("modes").children) b.classList.toggle("on", b.dataset.v === S.settings.price_mode);
}
function renderCards() {
  const sum = loc => S.items.filter(r => loc ? r.location === loc : r.counted).reduce((s, r) => s + (r.total || 0), 0);
  $("c-total").innerHTML = kin(sum());
  $("c-inv").innerHTML = kin(sum("Inventory"));
  $("c-char").innerHTML = kin(sum("Character storage"));
  $("c-srv").innerHTML = kin(sum("Server storage"));
  $("c-kinah").innerHTML = S.kinah ? kin(S.kinah) : '<span class="muted">–</span>';
  // Kinah is carried in the inventory and also kept in server storage: show where it is
  const by = Object.entries(S.kinah_by || {}).sort((a, b) => b[1] - a[1]);
  const short = { "Inventory": "inventory", "Server storage": "server storage" };
  $("c-kinah-k").textContent = by.length > 1
    ? "Tradable Kinah · " + by.map(([w, v]) => `${fmt(v)} ${short[w] || w.toLowerCase()}`).join(", ")
    : "Tradable Kinah";
  $("c-kinah-k").parentElement.title = by.map(([w, v]) => `${w}: ${v.toLocaleString()}`).join("\n");
  const counted = S.items.filter(r => r.counted);
  const priced = counted.filter(r => r.total != null).length;
  $("c-count").textContent = `${priced} / ${counted.length}`;
  const skipped = S.items.filter(r => !r.counted);
  const skippedVal = skipped.reduce((s, r) => s + (r.total || 0), 0);
  document.querySelector(".card.total").title = skipped.length
    ? `Not counted: ${skipped.length} item(s) in ${[...new Set(skipped.map(r => r.location))].join(", ")} (${fmt(skippedVal)})` : "";
}
function renderRows() {
  const rows = sorted(visible());
  $("rows").innerHTML = rows.map((r, i) => `<tr>
    <td><div class="name" data-i="${i}">${r.icon
      ? `<img src="${esc(r.icon)}" alt="" onload="this.classList.add('ok')" onerror="this.classList.add('ok')">`
      : `<span class="ph${r.info_pending ? " shim" : ""}"></span>`}
      <div><b class="g-${esc(r.grade || "Common")}">${esc(r.name)}</b><small>${esc(r.category || "")}</small></div></div></td>
    <td>${locCell(r)}</td>
    <td class="num">${r.count.toLocaleString()}</td>
    <td class="num">${r.basis === "stale" && r.unit == null
      ? `<span class="muted stale" title="Not listed on your server now and no recent sales">last ${fmt(r.p_last)}</span>`
      : (BASIS_MARK[r.basis] || "") + kin(r.unit)}</td>
    <td class="num total-cell">${kin(r.total)}</td>
    <td class="num ${r.change == null ? "flat" : r.change > 0.05 ? "up" : r.change < -0.05 ? "down" : "flat"}">${
      r.change == null ? "–" : (r.change > 0 ? "+" : "") + r.change.toFixed(r.change !== 0 && Math.abs(r.change) < 10 ? 1 : 0) + "%"}</td>
    <td>${spark(r.spark)}</td>
    <td class="num">${r.listings ?? '<span class="muted">–</span>'}</td>
    <td>${liquidity(r)}</td></tr>`).join("");
  $("rows")._data = rows;
  const empty = $("empty");
  if (!S.items.length) {
    empty.style.display = "";
    empty.innerHTML = `<h3>No storage loaded yet</h3>${esc(S.status.text)}
      <ol><li>Keep this window open.</li><li>Log in to your character (or go to character select and back).</li>
      <li>Your bag and warehouse appear here automatically. Open your warehouse once if it doesn't show.</li></ol>`;
  } else if (!rows.length) {
    empty.style.display = ""; empty.innerHTML = "<h3>Nothing matches</h3>Try another category, location or filter.";
  } else empty.style.display = "none";
}
function renderMeta() {
  const st = $("status");
  st.className = "status " + S.status.state;
  st.querySelector("span").textContent = S.status.text;
  const sel = $("server");
  if (!sel.options.length && S.servers.length) {
    const groups = {};
    for (const s of S.servers) (groups[s.region_name || s.region || "Other"] ||= []).push(s);
    sel.innerHTML = Object.entries(groups).map(([g, list]) => `<optgroup label="${esc(g)}">${
      list.map(s => `<option value="${s.server_id}">${esc(s.name)} · ${esc(s.faction || "")}</option>`).join("")}</optgroup>`).join("");
  }
  sel.value = String(S.settings.server_id);
  sel.classList.toggle("attn", !S.settings.server_chosen && !S.loading);
  if (document.activeElement !== $("fee")) $("fee").value = S.settings.fee_pct;
  const note = $("note");
  note.className = "note" + (S.price_error ? " err" : "");
  const srv = S.servers.find(s => s.server_id === S.settings.server_id);
  const srvName = srv ? `${srv.name} (${srv.region_name || srv.region} · ${srv.faction})` : "this server";
  note.textContent = S.price_error ||
    (S.loading ? `Loading market prices for ${srvName}… the first load of a server can take up to a minute.`
      : !S.settings.server_chosen ? "👉 Pick your server and faction (top right) so prices match your market." : "");
  const rp = S.region_progress;
  const region = rp ? `region prices: checking server ${rp[0] + 1}/${rp[1]}…`
    : S.region_at ? `region check: ${S.region_servers} servers, ${ago(S.region_at)}` : "region prices: pending";
  const req = S.api_requests ? ` · API calls this session: ${S.api_requests.exchange} exchange, ${S.api_requests.ncsoft} NCSOFT, ${S.api_requests.github} GitHub` : "";
  $("f-ver").textContent = "v" + S.version;
  $("upd").checked = S.settings.check_updates;
  $("f-prices").textContent = `Prices updated ${ago(S.prices_at)} · ${S.catalog_size} market items · ${region}${req}`;
  $("f-stats").textContent = S.stats ? `Packets ${S.stats.packets.toLocaleString()} · frames ${S.stats.frames.toLocaleString()} · inventory msgs ${S.stats.logins + S.stats.changes}` : "";
}
function renderBanner() {
  const b = $("banner"), st = S.status.state;
  let html = "", cls = "banner";
  if (st === "npcap_missing") {
    html = `<span class="bi">🔌</span><div><h3>Npcap is needed for live capture</h3>
      <ol><li>Download and run the Npcap installer (free, the same driver DPS meters use).</li>
      <li>Keep the default options. Leave <b>"Restrict Npcap driver's access to Administrators only"</b> unticked.</li>
      <li>Come back here and press <b>Check again</b>.</li></ol></div>
      <div class="acts"><a class="btn primary" href="${esc(S.npcap_url)}" target="_blank" rel="noopener">Download Npcap</a>
      <button data-act="recheck">Check again</button></div>`;
  } else if (st === "needs_admin") {
    html = `<span class="bi">🛡</span><div><h3>Npcap is set to administrators only</h3>
      <p>Restart AION 2 Vault as administrator, or reinstall Npcap with the admin-only option unticked.</p></div>
      <div class="acts"><button class="primary" data-act="admin">Restart as administrator</button>
      <button data-act="recheck">Check again</button></div>`;
  } else if (S.update) {
    const u = S.update;
    cls = "banner update";
    html = `<span class="bi">⬆</span><div><h3>AION 2 Vault ${esc(u.version)} is out</h3>
      <p>You have ${esc(S.version)}. Quit this one (tray icon → Quit), then unzip the new version. Your settings carry over.</p></div>
      <div class="acts"><a class="btn primary" href="${esc(u.url)}" target="_blank" rel="noopener">Download</a>
      <button data-act="dismiss-update" data-v="${esc(u.version)}">Dismiss</button></div>`;
  }
  b.className = cls;
  b.style.display = html ? "" : "none";
  if (b._html !== html) { b.innerHTML = html; b._html = html; }
}
$("banner").addEventListener("click", async e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "recheck") { a.textContent = "Checking…"; await post("/api/npcap/recheck"); setTimeout(() => { a.textContent = "Check again"; }, 3500); }
  if (a.dataset.act === "admin") { const r = await post("/api/restart-admin"); if (!r.ok) a.textContent = "Cancelled — try again"; }
  if (a.dataset.act === "dismiss-update") post("/api/settings", { dismissed_update: a.dataset.v });
});
$("upd").addEventListener("change", e => post("/api/settings", { check_updates: e.target.checked }));
function render() {
  if (!S) return;
  renderBanner(); renderMeta(); renderPills(); renderCats(); renderCards(); renderHead(); renderRows();
}

let lastJson = "";
async function poll() {
  try {
    const t = await (await fetch("/api/state", { cache: "no-store", headers: { "X-Vault-Token": TOKEN } })).text();
    if (t !== lastJson) { lastJson = t; S = JSON.parse(t); render(); }
  } catch (e) {
    const st = $("status"); st.className = "status error"; st.querySelector("span").textContent = "App not running";
  }
}
const TOKEN = document.querySelector('meta[name="vault-token"]').content;
const HDRS = { "Content-Type": "application/json", "X-Vault-Token": TOKEN };
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: HDRS, body: JSON.stringify(body || {}) });
  setTimeout(poll, 150);
  return r.json().catch(() => ({}));
}

$("head").addEventListener("click", e => {
  const th = e.target.closest("th"); if (!th) return;
  const c = COLS.find(c => c.k === th.dataset.k); if (!c || c.nosort) return;
  if (view.sort === c.k) view.dir *= -1; else { view.sort = c.k; view.dir = c.num ? -1 : 1; }
  saveView(); render();
});
$("cats").addEventListener("click", e => { const c = e.target.closest(".cat"); if (c) { view.cat = c.dataset.c; saveView(); render(); } });
$("locs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { view.loc = b.dataset.v; saveView(); render(); } });
$("modes").addEventListener("click", e => { const b = e.target.closest("button"); if (b) post("/api/settings", { price_mode: b.dataset.v }); });
$("q").value = view.q;
$("q").addEventListener("input", e => { view.q = e.target.value; saveView(); render(); });
$("unpriced").checked = view.unpriced;
$("unpriced").addEventListener("change", e => { view.unpriced = e.target.checked; saveView(); render(); });
$("fee").addEventListener("change", e => post("/api/settings", { fee_pct: parseFloat(e.target.value) || 0 }));
$("server").addEventListener("change", e => post("/api/settings", { server_id: +e.target.value }));
// Refresh button: refreshing (spinner) -> updated/failed (2.5 s) -> 30 s cooldown countdown
const COOLDOWN_MS = 30000;
const RB = { phase: "idle", clickedAt: 0, doneAt: 0, until: 0 };
function syncRefresh() {
  const b = $("refresh"), now = Date.now();
  if (S && S.refresh_cooldown > 0) RB.until = Math.max(RB.until, now + S.refresh_cooldown * 1000 - 300);
  if (RB.phase === "refreshing" && S) {
    const fresh = S.prices_at && S.prices_at * 1000 >= RB.clickedAt - 500 && !S.refreshing;
    if (fresh) {
      RB.phase = "done"; RB.doneAt = now;
      const c = document.querySelector(".cards"); c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash");
    } else if (now - RB.clickedAt > 120000 || (S.price_error && now - RB.clickedAt > 3000)) {
      RB.phase = "failed"; RB.doneAt = now;
    }
  }
  if (["done", "failed", "fresh"].includes(RB.phase) && now - RB.doneAt > 2500) RB.phase = "idle";
  const left = Math.ceil((RB.until - now) / 1000);
  let ic = "↻", lbl = "Prices", cls = "", title = "Refetch prices";
  if (RB.phase === "refreshing") { cls = "spin"; lbl = "Refreshing…"; title = "Fetching the latest prices…"; }
  else if (RB.phase === "done") { ic = "✓"; lbl = "Updated"; cls = "ok"; }
  else if (RB.phase === "fresh") { ic = "✓"; lbl = "Up to date"; cls = "ok";
    title = `Prices are from ${ago(S && S.prices_at)}; the exchange only updates hourly`; }
  else if (RB.phase === "failed") { ic = "✕"; lbl = "Failed"; cls = "bad"; title = S && S.price_error || "Refresh failed"; }
  else if (left > 0) { lbl = `${left}s`; cls = "cool"; title = `Available again in ${left}s`; }
  b.className = "btn " + cls;
  b.disabled = RB.phase === "refreshing" || left > 0;
  b.title = title;
  b.style.setProperty("--p", left > 0 ? (100 - ((RB.until - now) / COOLDOWN_MS) * 100).toFixed(1) + "%" : "0%");
  b.querySelector(".ic").textContent = ic;
  b.querySelector(".lbl").textContent = lbl;
}
$("refresh").addEventListener("click", async () => {
  if ($("refresh").disabled) return;
  RB.phase = "refreshing"; RB.clickedAt = Date.now(); RB.until = RB.clickedAt + COOLDOWN_MS;
  syncRefresh();
  try {
    const r = await (await fetch("/api/refresh", { method: "POST", headers: HDRS, body: "{}" })).json();
    if (!r.ok) { RB.phase = "idle"; RB.until = Date.now() + (r.cooldown || 0) * 1000; }
    else if (r.fresh) { RB.phase = "fresh"; RB.doneAt = Date.now(); }
  } catch (e) { RB.phase = "failed"; RB.doneAt = Date.now(); }
  setTimeout(poll, 150);
});
setInterval(syncRefresh, 250);

// Quiet "working on it" spinner: background fetches from the app + icons still downloading here
function syncActivity() {
  const el = $("activity");
  const tasks = S ? [...(S.activity || [])] : ["Starting"];
  const icons = [...document.querySelectorAll("#rows img")].filter(i => !i.complete).length;
  if (icons && !tasks.some(t => t.startsWith("Fetching item"))) tasks.push(`Loading icons · ${icons} left`);
  el.classList.toggle("on", tasks.length > 0);
  if (!tasks.length) return;
  const txt = tasks[0] + (tasks.length > 1 ? ` (+${tasks.length - 1} more)` : "");
  const span = el.querySelector("span");
  if (span.textContent !== txt) span.textContent = txt;
  el.title = tasks.join("\n");
}
setInterval(syncActivity, 500);

const tip = $("tip");
$("rows").addEventListener("mousemove", e => {
  const tr = e.target.closest("tr"), el = tr && tr.querySelector(".name");
  if (!el || e.target.closest(".mark")) { tip.style.display = "none"; return; }
  const r = $("rows")._data[+el.dataset.i];
  const line = (b, label, v, extra) => v == null ? "" :
    `<tr class="${r.basis === b || (b === "region" && r.basis === "region_cap") ? "use" : ""}"><td>${label}</td><td class="num">${kin(v)}</td><td class="muted">${extra || ""}</td></tr>`;
  const prices = r.unit == null ? (r.basis === "stale" ? `<table>
      ${line("-", "Last listed here", r.p_last, r.last_seen ? new Date(r.last_seen).toLocaleDateString() : "")}
      ${line("region", "Region median", r.p_region, r.p_region_n + " servers")}
    </table><div class="meta">Not listed on your server now and no recent sales, so it isn't priced or counted</div>` : "") : `<table>
      ${line("listing", "Lowest listing now", r.p_listing, r.listings != null ? r.listings + " listed" : "")}
      ${line("week", "7-day median", r.p_week)}
      ${line("sold", "24h sold average", r.p_sold, r.p_sold_n + " sold")}
      ${line("region", "Region median", r.p_region, r.p_region_n + " servers")}
    </table><div class="meta">Using ${esc(BASIS_TEXT[r.basis] || "")}${S.settings.fee_pct ? ` · after ${S.settings.fee_pct}% fee` : ""}</div>`;
  tip.innerHTML = `<h4 class="g-${esc(r.grade || "Common")}">${esc(r.name)}</h4>
    ${r.desc ? `<p>${esc(r.desc)}</p>` : ""}${r.icon ? `<img src="${esc(r.icon)}" alt="">` : ""}
    <div class="meta">${esc(r.grade || "")} ${r.category ? "· " + esc(r.category) : ""} · #${r.key}</div>${prices}`;
  tip.style.display = "block";
  const x = Math.min(e.clientX + 16, innerWidth - 400), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 10);
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
$("rows").addEventListener("mouseleave", () => tip.style.display = "none");

poll();
setInterval(poll, 2000);
setInterval(() => S && renderMeta(), 30000);
</script>
</body>
</html>
